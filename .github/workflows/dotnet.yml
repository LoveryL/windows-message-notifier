name: .NET

on:
  push:
    tags:
      - 'p*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish --configuration Release --no-build

    - name: Package build artifacts
      run: |
        Compress-Archive -Path "${{ github.workspace }}\bin\Release\net10.0-windows10.0.22621.0\publish\*" -DestinationPath "${{ github.workspace }}\release.zip" -Force
      shell: pwsh

    - name: Create Release
      run: |
        gh release create ${{ github.ref_name }} `
          --title "Release ${{ github.ref_name }}" `
          --notes "GitHub Action 自动发布`nCommit: ${{ github.sha }}`nTag: ${{ github.ref_name }}" `
          --prerelease `
          "${{ github.workspace }}\release.zip"
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
